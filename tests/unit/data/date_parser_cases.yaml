  - phrase: "The run is planned for the evening of September 14."
    status: converts
  - phrase: "Raid should start sometime around 8 tomorrow."
    status: converts
  - phrase: "Can everyone make next Friday at about 7 PM PST?"
    status: converts
  - phrase: "We'll probably go Saturday evening around nine."
    status: converts
  - phrase: "Let's try the 14th at noon."
