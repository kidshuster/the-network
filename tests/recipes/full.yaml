name: full
description: Complete production-behavior smoke test in one Discord session
budgets:
  max_mutations: 250
  max_rest_reads: 800
  max_rate_limit_wait_seconds: 300
  max_duration_seconds: 1800
steps:
  - artifacts.cleanup
  - probe: permissions.provision
    pause: true
  - probe: onboarding.join_approval
    pause: true
  - probe: relay.setup_welcome
    pause: true
  - probe: relay.hub_announcement
    pause: true
  - probe: hub.rebuild
    pause: true
  - recipe: functional
  - clients.protected
finally:
  - probe: artifacts.teardown
    protect_clients: false
  - clients.protected
