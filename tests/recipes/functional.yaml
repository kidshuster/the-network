name: functional
description: Permission and layout checks used by the full suite
budgets:
  max_mutations: 80
  max_rest_reads: 250
  max_rate_limit_wait_seconds: 120
  max_duration_seconds: 300
steps:
  - hub.operator
  - hub.manage_server
  - hub.admin_channel
  - hub.layout
  - hub.announcement_channel
  - probe: hub.leaders_drift
    pause: true
  - hub.leaders_access
