name: CI

on:
  push:
    branches: [main, master, refactor]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy bot tests/core

      - name: Unit tests
        run: pytest -q tests/unit

      - name: Mock smoke tests
        run: |
          python -m tests.core.runner recipe full --backend mock
          python -m tests.core.runner recipe server-init-stress \
            --backend mock --scenario malformed_channels

      - name: Install bundle check
        run: ./bin/test_deploy_bundle.sh
