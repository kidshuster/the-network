name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy bot tests/live

      - name: Pytest
        run: pytest -q tests/unit

      - name: Discord API compatibility
        run: pytest -q tests/unit/test_discord_api_compat.py

      - name: Install bundle check
        run: ./bin/test_deploy_bundle.sh
