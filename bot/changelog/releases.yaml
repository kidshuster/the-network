releases:
  "1.2.15":
    summary: "Smoke teardown script, hub announcements channel type, and the-network display name."
    changes:
      - "Add bin/smoke_teardown.sh to remove all smoke clients, channels, categories, roles, and emojis after test batches."
      - "Create #network-announcements as news=True; migrate legacy plain-text channels on server init."
      - "Rename hub announcements client display name to the-network for aligned welcome copy."
      - "Fix Leaders channel permission sync false warnings via incremental overwrite fallback."
  "1.2.14":
    summary: "Hub-owned announcements client for moderator network-wide broadcasts."
    changes:
      - "Provision The Network Announcements client on server init with bot avatar; auto-subscribe to all networks."
      - "Add moderator-only #network-announcements — posts relay to all networks unless prefixed with [network_key]."
      - "Hub client is write-only (no inbound relays, no setup stickies or member welcome spam)."
      - "Live smoke for hub inject relay, mod dispatch, and write-only guard."
  "1.2.13":
    summary: "Single setup welcome per channel, blacklist-aware broadcasts, clearer setup cards."
    changes:
      - "Post one activation welcome on the joining client's subscribe channel; skip duplicate member broadcast to the same channel."
      - "Suppress network member welcome on servers that blacklisted the joining client."
      - "Subscribe setup suggests a 🌐-<network name> channel; publish setup notes Channel Follow is desktop-only."
      - "Add live smoke for setup sticky copy and welcome/blacklist behavior."
  "1.2.12":
    summary: "Hub profile channel create fix, operator Create Expressions check, live smoke regressions."
    changes:
      - "Create hub profile channels without overwrites at create time, then sync (fixes 50013 in client categories)."
      - "Require Create Expressions on the operator role during provisioning validation."
      - "Add Testwork live smoke orchestrator and pytest regressions for leaders drift and init degradation."
  "1.2.11":
    summary: "Clarify init probe failures for outdated deploys vs permission issues."
    changes:
      - "Provisioning probe errors now show running bot version and update steps when deploy is stale."
  "1.2.10":
    summary: "Log bot version on startup; CI guard for discord.py channel create kwargs."
    changes:
      - "Add CI test that rejects invalid create_text_channel kwargs before release."
      - "Log installed bot version on ready for easier deploy verification."
  "1.2.9":
    summary: "Fix channel creation regression from invalid sync_permissions kwarg."
    changes:
      - "Remove sync_permissions from create_text_channel calls — discord.py only supports it on edit."
  "1.2.8":
    summary: "Fix Leaders channel permission sync 50013 errors."
    changes:
      - "Apply channel overwrites in one edit instead of toggling category sync."
      - "Create Leaders channels with overwrites at creation time."
      - "Resolve #changelog only inside the Leaders category."
  "1.2.7":
    summary: "Fix Leaders changelog permission sync when operator is the bot's top role."
    changes:
      - "Always grant the operator role on Leaders channels and category overwrites."
      - "Ignore stale stored Leaders channel IDs outside the Leaders category."
  "1.2.6":
    summary: "Remove Leaders channel rebuild fallback; sync permissions only."
    changes:
      - "Drop -rebuild channel recovery; init creates or syncs Leaders channels in place."
      - "Prefer stored channel IDs when rectifying Leaders permissions."
  "1.2.5":
    summary: "Fix bot access to Leaders sub-channels for permission sync."
    changes:
      - "Grant the bot operator role access on #leaders-channel and #changelog."
      - "Rebuild inaccessible Leaders channels when the bot was locked out (50001)."
  "1.2.4":
    summary: "Fix Leaders channel permission refresh and changelog embed limits."
    changes:
      - "Re-sync Leaders sub-channels from the category before applying channel overwrites."
      - "Truncate server init rectification embeds to Discord field limits."
      - "Split long changelog bullet lists across multiple embed fields."
  "1.2.3":
    summary: "Server init rectifies existing client permissions with a detailed report."
    changes:
      - "Second init card lists Leaders and client profile permission rectification work."
      - "Init validates stored profiles, syncs missing channel permissions, and reports skips."
      - "Fix legacy #leaders channel lookup inside the Leaders category."
  "1.2.2":
    summary: "Fix Leaders channel permissions for new client profiles."
    changes:
      - "Grant client roles access to #leaders-channel and #changelog when a profile is approved."
      - "Apply channel overwrites via set_permissions so synced channels update reliably."
      - "Server init re-syncs Leaders permissions for all stored client roles."
  "1.2.1":
    summary: "Fix #changelog permissions for client roles."
    changes:
      - "Client roles can view and read history in #changelog but cannot send messages."
      - "Break category permission sync on channel create so Leaders post access is not inherited."
  "1.2.0":
    summary: "Changelog backfill on server init and startup."
    changes:
      - "Post all missing release notes from the catalog in version order."
      - "Backfill runs on /server init and when the bot starts."
      - "Skips versions already posted so re-init does not duplicate entries."
  "1.1.20":
    summary: "Leaders changelog channel and automatic release notes."
    changes:
      - "New #changelog channel in Leaders posts an embed when the bot updates."
      - "Changelog is read-only for server leaders; moderators can post."
  "1.1.19":
    summary: "Server-connected welcome messages and clearer subscribe setup."
    changes:
      - "Publish a server-connected embed to new subscribe channels when a network activates."
      - "Broadcast a network welcome to other members on the same network."
      - "Rename the subscribe setup button to Subscribed channel connected."
  "1.1.18":
    summary: "Date/time parsing fixes and smoke tests."
    changes:
      - "Fix relative date matching so trailing commands are not swallowed."
      - "Normalize tonight and next-weekday phrases for reliable timecodes."
      - "Add comprehensive date parser smoke tests."
  "1.1.17":
    summary: "Relay startup fix for profile views with many networks."
    changes:
      - "Fix profile view component limit that could prevent the bot from starting."
      - "Keep relay running if date parsing fails on a single message."
  "1.1.16":
    summary: "Discord timecodes on relayed announcements."
    changes:
      - "Convert dates and times in relayed messages to Discord timecodes."
      - "Add a per-client timecode toggle on profile cards."
