kind: embed
title: "Connect your subscribe channel"
colour: blurple
description: |
  This **announcement** channel relays network posts to servers that follow it.
fields:
  - name: Steps
    value: |
      1. On **your server**, create an announcement channel named **{network_channel_name}** (or pick an existing one that should receive network posts).
      2. In **that channel**, click **Follow**, select **this hub server**, and choose {subscribe_mention}.
      3. Click **Subscribed channel connected** below (also available on your **network-profile** moderation card).
    inline: false
footer: "The Network • subscribe setup • removed after you confirm"
