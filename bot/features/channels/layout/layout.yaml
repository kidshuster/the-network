version: 1
retired_channels:
  - commands
  - moderator-only
  - mod-only
  - staff-only
  - leaders
  - welcome-sink
permission_profiles:
  moderation:
    roles: [everyone, moderator, bot_access]
  network_readonly:
    roles: [everyone, moderator, bot_access]
    overrides:
      everyone: {view_channel: true, read_message_history: true}
  leaders_readonly:
    roles: [everyone, client_roles, moderator, bot_access]
  client_private:
    roles: [everyone, client_owner, moderator, bot_access]
  client_publish:
    roles: [everyone, client_owner, moderator, bot_access]
    overrides:
      client_owner: {manage_webhooks: true}

layout:
  categories:
    moderation:
      name: Moderation
      position: 0
      profile: moderation
      channels:
        admin:
          name: admin
          topic: Moderator commands, administration, and bot error reports
          community_slot: public_updates
          lifecycle: preserve
          legacy_names: [commands, moderator-only, mod-only, staff-only]
          overrides:
            moderator: {use_application_commands: true}
          position: 0
          installs:
            - sticky: network-admin
              view: network_admin
        join_requests:
          name: join-requests
          topic: Pending client join requests
          position: 1
        network_announcements:
          name: network-announcements
          type: text
          position: 2
          installs:
            - guide: announcements
    network:
      name: The Network
      position: 1
      profile: network_readonly
      channels:
        rules:
          name: rules
          community_slot: rules
          lifecycle: preserve
          position: 0
          installs:
            - sticky: hub-rules
        join_the_network:
          name: join-the-network
          topic: Join The Network hub as a client
          position: 1
          installs:
            - sticky: join-the-network
              view: join_network
    leaders:
      name: Leaders
      position: 2
      profile: leaders_readonly
      channels:
        leaders_channel:
          name: leaders-channel
          topic: Private channel for participating server leaders
          lifecycle: preserve
          legacy_names: [leaders]
          position: 0
          overrides:
            client_roles: {send_messages: true, embed_links: true, attach_files: true, add_reactions: true}
        changelog:
          name: changelog
          topic: Release notes for The Network bot
          lifecycle: preserve
          position: 1
          installs:
            - sync: changelog_releases
  client_category:
    name: "{server_name}"
    profile: client_private
    channels:
      profile:
        name: "{slug}-profile"
        topic: "Profile and network subscriptions for {server_name}"
        instances: per_client
        position: 0
      publish:
        name: "{slug}-{network_key}-publish"
        topic: "Publish channel for network {network_key}"
        instances: per_subscription
        profile: client_publish
        position: 11
      subscribe:
        name: "{slug}-{network_key}-subscribe"
        type: announcement
        instances: per_subscription
        position: 10
