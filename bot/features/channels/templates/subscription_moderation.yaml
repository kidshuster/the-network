kind: embed
title: "Moderation — {network_display_name}"
colour: dark_grey
description: |
  Manage **`{network_key}`** from **`📚-{client_slug}-profile`**.

  **Write mode:** publish via **`📤-{client_slug}-{network_key}-publish`**, receive via **`🌐-{client_slug}-{network_key}-subscribe`**.
  Use **Blacklist** to hide specific clients, or **Leave {network_key}** to unsubscribe.

  Profile toggles: **Timecodes** converts times in your outgoing announcements; **Read-only** swaps publish for an announcements channel if you only want to receive (and still post via hub announcements).
