kind: embed
title: "Moderation — {network_display_name}"
colour: dark_grey
description: |
  Manage **`{network_key}`** from **`{client_slug}-profile`**.

  **Read-only mode:** this client only receives via **`{client_slug}-{network_key}-subscribe`** (no publish channel).
  Use **Blacklist** to hide specific clients, or **Leave {network_key}** to unsubscribe.

  Turn **Read-only: Off** on the profile if you need to announce into the network. **Timecodes** applies to outgoing posts once publishing is enabled.
