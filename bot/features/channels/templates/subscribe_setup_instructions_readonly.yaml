kind: embed
title: "Connect your subscribe channel (read-only)"
colour: blurple
description: |
  This client is **read-only**: you **receive** network announcements on subscribe, and can still **post** via the **`📢-…-announcements`** channel (blacklist rules apply).

  Setup is complete after you connect and confirm this subscribe feed.
fields:
  - name: Steps
    value: |
      1. On **your server**, create an announcement channel named **{network_channel_name}** (or reuse one that should receive network posts).
      2. In **that channel**, click **Follow**, select **this hub server**, and choose {subscribe_mention}.
      3. Click **Subscribed channel connected** below (also on your **client-profile** moderation card).
    inline: false
  - name: Timecodes
    value: |
      Incoming posts may already include Discord timestamps from publishers with Timecodes enabled.
      Your profile **Timecodes** toggle also converts times in posts you send from the announcements channel.
    inline: false
  - name: Profile toggles
    value: |
      **Read-only: On** — subscribe + hub announcements channel (no Channel Follow publish).
      Turn **Read-only: Off** on the profile card to remove announcements and create a normal publish channel.
    inline: false
footer: "The Network • subscribe setup • removed after you confirm"
