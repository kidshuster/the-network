kind: embed
title: "Join The Network"
colour: green
description: |
  Click **Join Network** below and submit your community name and a profile image.
  Moderators review submissions in their private area.
fields:
  - name: What happens next
    value: |
      After approval you get a client category with a **client-profile** card and network join buttons.
      Each network adds setup cards in your channels:
      • **Write mode** (default) — publish + subscribe instruction cards
      • **Read-only** — subscribe only (toggle on the profile if you never need to announce)
    inline: false
  - name: Profile toggles
    value: |
      **Timecodes** — when On, times in your outgoing announcements (like `raid at 5:30 pst`) become Discord timestamps for every viewer.
      **Read-only** — when On, the publish channel is removed and setup finishes after subscribe is confirmed.
    inline: false
footer: "The Network • join the network • v{version}"
