kind: view
id: subscription_moderation
timeout: null
components:
  - type: button
    id: connected
    label: "Subscribed channel connected"
    style: success
    custom_id: "tn:sub_connected:{subscription_id}"
    when: show_subscribe_connected
    params:
      subscription_id: context.subscription_id
      network_key: context.network_key
    action:
      trigger: subscription.confirm_connected
      require: [bot_ready]
      inject: [guild, view_registry]
      on_success:
        embed: review_success
  - type: button
    id: blacklist
    label: Blacklist
    style: danger
    custom_id: "tn:blacklist:{subscription_id}"
    when: show_blacklist
    params:
      subscription_id: context.subscription_id
      network_key: context.network_key
    action:
      open_view: blacklist_select
      defer: false
      require:
        - bot_ready
        - client_role:
            popup: client_role_required_blacklist
            membership: required
  - type: button
    id: leave
    label: "Leave {network_key}"
    style: secondary
    custom_id: "tn:leave:{subscription_id}"
    params:
      subscription_id: context.subscription_id
      network_key: context.network_key
    action:
      trigger: subscription.leave
      require:
        - bot_ready
        - client_role:
            popup: client_role_required_leave
            membership: required
      inject: [guild, bot_member, view_registry]
      on_success:
        embed: leave_network_success
        map:
          network_key: params.network_key
