kind: embed
colour: '{colour}'
description: 'Your client profile on **The Network** hub.

  Use the network buttons to subscribe.
  '
author_name: '{author_name}'
author_icon_url: '{author_icon_url}'
fields:
- name: Server name
  value: '{server_name}'
  inline: true
- name: Status
  value: '{status}'
  inline: true
- name: Timecodes
  value: '{timecode_status}'
  inline: true
- name: Read-only
  value: '{read_only_status}'
  inline: true
- name: Toggles
  value: |
    **Timecodes** — converts times in your outgoing announcements when On.
    **Read-only** — receive via subscribe and post via a hub announcements channel (blacklists apply).
    **Write mode** — Channel Follow publish into the network. Requires a Discord Community server.
  inline: false
- name: Subscribed networks
  value: '{networks_value}'
  inline: false
  optional: true
- name: Networks
  value: Click a network button below to subscribe.
  inline: false
  optional: true
footer: The Network • client profile • use Edit Profile or network buttons below
