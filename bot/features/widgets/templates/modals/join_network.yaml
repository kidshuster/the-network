kind: modal
title: "Join the network"
trigger: request.submit
require:
  - hub_guild:
      popup: hub_guild_only
inject: [guild, requester, view_registry]
field_map:
  name: server_name
on_success:
  reply:
    embed: join_request_submitted
    map:
      client_name: params.client_name
fields:
  - id: name
    type: text
    label: "Name"
    description: "Your community name on the hub. Shown on relayed messages; editable via Edit Profile."
    placeholder: "My Community Server"
    max_length: 100
    required: true
  - id: profile_image
    type: file_upload
    label: "Profile image"
    description: "Upload a PNG, JPG, WebP, or GIF"
    required: true
    max_values: 1
