kind: modal
title: "Delete network"
trigger: network.delete
require: [manage_guild, hub_guild]
inject: [guild, view_registry]
on_success:
  reply:
    popup: network_deleted
    map:
      key: params.key
fields:
  - id: key
    type: text
    label: "Network key (nkey)"
    description: "Key of the network to remove from the registry (client subscriptions are kept)"
    placeholder: "my-network"
    max_length: 50
    required: true
