kind: modal
title: "Create network"
trigger: network.create
require: [manage_guild, hub_guild]
inject: [guild, view_registry]
on_success:
  reply:
    embed: network_created
    map:
      key: params.key
      display_name: params.display_name
      updated_count: params.updated_count
      relinked: params.relinked
fields:
  - id: key
    type: text
    label: "Network key (nkey)"
    description: "Short identifier used in channel names and buttons"
    placeholder: "my-network"
    max_length: 50
    required: true
  - id: display_name
    type: text
    label: "Display name"
    description: "Human-readable network name"
    placeholder: "My Network"
    max_length: 100
    required: true
