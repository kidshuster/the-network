kind: modal
title: "Edit profile"
trigger: client.edit_profile
require:
  - hub_guild:
      popup: hub_guild_form_only
  - client_role:
      popup: client_role_required_edit
      membership: allow_non_member
      ephemeral: null
inject: [guild, view_registry]
on_success:
  reply:
    embed: profile_updated
    map:
      display_name: params.display_name
      warnings: params.warnings
fields:
  - id: display_name
    type: text
    label: "Display name"
    description: "Name shown on relayed messages"
    placeholder: "My Server"
    max_length: 100
    required: true
  - id: profile_image
    type: file_upload
    label: "Profile image"
    description: "Upload a PNG, JPG, WebP, or GIF (optional — leave empty to keep current)"
    required: false
    max_values: 1
