kind: hub_layout
categories:
  - id: moderation
    name: Moderation
    position: 0
    managed: hub
    overwrites:
      - role: everyone
        preset: everyone_hidden_category
      - role: moderator
        preset: moderator_staff_slash
      - role: bot
        preset: bot_hub

  - id: network
    name: The Network
    position: 1
    managed: hub
    overwrites:
      - role: everyone
        preset: everyone_readonly_category
      - role: access
        preset: network_access
      - role: moderator
        preset: moderator_staff_category
      - role: bot
        preset: bot_hub

  - id: leaders
    name: Leaders
    position: 2
    managed: hub
    overwrites:
      - role: everyone
        preset: everyone_hidden_category
      - role: access
        preset: everyone_hidden_category
      - role: client
        scope: all_clients
        preset: client_leader_talk
      - role: operator
        preset: bot_hub
      - role: moderator
        preset: moderator_staff_category
      - role: bot
        preset: bot_hub

channels:
  - id: rules
    name: rules
    category: network
    type: text
    managed: hub
    community_slot: rules
    preserve_on_uninit: true
    legacy_names: [rules]
    inherit: false
    overwrites:
      - role: everyone
        preset: everyone_readonly
      - role: access
        preset: network_access
      - role: moderator
        preset: moderator_staff

  - id: join_the_network
    name: join-the-network
    category: network
    type: text
    topic: Join The Network hub as a client
    managed: hub
    inherit: true
    position: 1
    overwrites:
      - role: everyone
        preset: everyone_readonly
      - role: access
        preset: network_access
      - role: moderator
        preset: moderator_staff

  - id: moderator_only
    name: moderator-only
    category: moderation
    type: text
    topic: Moderator discussion
    managed: hub
    community_slot: moderators
    preserve_on_uninit: true
    legacy_names: [mod-only, staff-only]
    inherit: true
    position: 0
    overwrites:
      - role: everyone
        preset: everyone_hidden
      - role: moderator
        preset: moderator_staff

  - id: network_announcements
    name: network-announcements
    category: moderation
    type: announcement
    managed: hub
    inherit: false
    position: 1
    overwrites:
      - role: everyone
        preset: everyone_hidden
      - role: moderator
        preset: moderator_announcement
      - role: operator
        preset: moderator_announcement

  - id: join_requests
    name: join-requests
    category: moderation
    type: text
    topic: Pending client join requests
    managed: hub
    inherit: true
    position: 2
    overwrites:
      - role: everyone
        preset: everyone_hidden
      - role: moderator
        preset: moderator_staff

  - id: commands
    name: commands
    category: moderation
    type: text
    topic: Network administration
    managed: hub
    inherit: true
    position: 3
    overwrites:
      - role: everyone
        preset: everyone_hidden
      - role: moderator
        preset: moderator_staff_slash

  - id: leaders
    name: leaders-channel
    category: leaders
    type: text
    topic: Private channel for participating server leaders
    managed: hub
    preserve_on_uninit: true
    legacy_names: [leaders]
    inherit: false
    position: 0
    overwrites:
      - role: everyone
        preset: everyone_hidden
      - role: access
        preset: everyone_hidden
      - role: client
        scope: all_clients
        preset: client_leader_talk
      - role: operator
        preset: bot_hub
      - role: moderator
        preset: moderator_staff

  - id: changelog
    name: changelog
    category: leaders
    type: text
    topic: Release notes for The Network bot
    managed: hub
    preserve_on_uninit: true
    inherit: false
    position: 1
    overwrites:
      - role: everyone
        preset: everyone_hidden
      - role: access
        preset: everyone_hidden
      - role: client
        scope: all_clients
        preset: client_changelog_readonly
      - role: operator
        preset: bot_hub
      - role: moderator
        preset: moderator_staff
