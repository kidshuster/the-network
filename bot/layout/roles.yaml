version: 1
roles:
  everyone:
    target: everyone
    permissions: {view_channel: false, send_messages: false, add_reactions: false, create_public_threads: false, create_private_threads: false, send_messages_in_threads: false}
  network_access:
    target: network_access
    permissions: {view_channel: true, read_message_history: true, manage_webhooks: true, send_messages: true, embed_links: true, attach_files: true}
  client_roles:
    target: client_roles
    permissions: {view_channel: true, read_message_history: true, send_messages: false, embed_links: false, attach_files: false, add_reactions: false, create_public_threads: false, create_private_threads: false, send_messages_in_threads: false}
  client_owner:
    target: current_client_role
    permissions: {view_channel: true, read_message_history: true, send_messages: false, add_reactions: false, create_public_threads: false, create_private_threads: false, send_messages_in_threads: false}
  moderator:
    target: moderator
    permissions: {view_channel: true, read_message_history: true, send_messages: true, embed_links: true, attach_files: true, manage_channels: true, manage_webhooks: true, manage_messages: true, create_public_threads: true, send_messages_in_threads: true}
  bot_access:
    target: bot_access
    permissions: {view_channel: true, read_message_history: true, send_messages: true, embed_links: true, attach_files: true, manage_channels: true, manage_messages: true, manage_webhooks: true}
